# src-tauri/Cargo.toml
[package]
name = "universal-translator"
version = "0.1.1"
description = "Private desktop translation"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "universal_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["sync", "time", "macros", "process", "io-util", "fs"] }
tokio-util = "0.7"
async-trait = "0.1"
url = "2"
sha2 = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
arboard = "3"
tempfile = "3"
html-escape = "0.2"
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWindow", "NSResponder", "NSWorkspace", "NSRunningApplication"] }
core-graphics = "0.25"
core-foundation = "0.10"

[dev-dependencies]
wiremock = "0.6"
